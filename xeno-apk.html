<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XENO BUGS INFORMATION</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Arial,sans-serif; }
  body { background:#0d0d0d; color:#fff; min-height:100vh; }

  header {
    position:sticky; top:0; z-index:100;
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 20px;
    background:linear-gradient(90deg,#1a0033,#0d0d0d);
    border-bottom:2px solid #a020f0;
    box-shadow:0 0 20px rgba(160,32,240,.5);
  }
  .logo {
    font-size:22px; font-weight:bold;
    background:linear-gradient(90deg,#a020f0,#ff00ff);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    letter-spacing:1px;
  }
  .logo span { color:#ff00ff; }

  .header-right { display:flex; gap:10px; align-items:center; }

  #loginBtn, #logoutBtn {
    background:linear-gradient(90deg,#a020f0,#ff00ff);
    border:none; color:#fff; padding:8px 16px;
    border-radius:6px; cursor:pointer; font-weight:bold;
    transition:.2s; font-size:14px;
  }
  #loginBtn:hover { transform:scale(1.05); box-shadow:0 0 15px #ff00ff; }
  #logoutBtn { background:linear-gradient(90deg,#555,#333); }

  .search-wrap { max-width:700px; margin:25px auto 10px; padding:0 15px; }
  #searchInput {
    width:100%; padding:14px 18px; border-radius:30px;
    border:2px solid #a020f0; background:#1a1a1a; color:#fff;
    font-size:16px; outline:none;
    box-shadow:0 0 15px rgba(160,32,240,.3);
  }
  #searchInput:focus { box-shadow:0 0 25px #ff00ff; }

  .grid {
    max-width:1200px; margin:20px auto; padding:0 15px;
    display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:20px;
  }

  .card {
    background:#151515; border-radius:10px; overflow:hidden;
    border:1px solid #2a2a2a; cursor:pointer; transition:.2s;
    position:relative;
  }
  .card:hover { transform:translateY(-4px); box-shadow:0 0 20px rgba(160,32,240,.6); border-color:#a020f0; }
  .card-thumb {
    width:100%; height:150px;
    background:linear-gradient(135deg,#2a004d,#0d0d0d);
    display:flex; align-items:center; justify-content:center;
    font-size:40px; font-weight:bold; color:#a020f0;
    position:relative; overflow:hidden;
  }
  .card-thumb img { width:100%; height:100%; object-fit:cover; }
  .card-info { padding:12px 14px; }
  .card-title {
    font-size:15px; font-weight:bold; margin-bottom:6px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .card-version {
    display:inline-block; background:#a020f0; color:#fff;
    font-size:11px; padding:3px 8px; border-radius:4px; font-weight:bold;
  }

  .card-actions {
    display:none; position:absolute; top:8px; right:8px; gap:6px;
    z-index:5;
  }
  .card-actions.show { display:flex; }
  .icon-btn {
    width:32px; height:32px; border-radius:50%; border:none;
    cursor:pointer; font-size:14px; font-weight:bold;
    display:flex; align-items:center; justify-content:center;
    transition:.2s; color:#fff;
  }
  .icon-edit { background:#2196f3; }
  .icon-edit:hover { background:#42a5f5; transform:scale(1.15); }
  .icon-del { background:#f44336; }
  .icon-del:hover { background:#ef5350; transform:scale(1.15); }

  .modal {
    display:none; position:fixed; inset:0;
    background:rgba(0,0,0,.8); z-index:200;
    align-items:center; justify-content:center; padding:15px;
  }
  .modal.active { display:flex; }
  .modal-box {
    background:#1a1a1a; border:2px solid #a020f0; border-radius:12px;
    padding:25px; max-width:450px; width:100%;
    box-shadow:0 0 40px rgba(160,32,240,.5);
    max-height:90vh; overflow-y:auto;
  }
  .modal-box h2 {
    margin-bottom:15px; font-size:18px;
    background:linear-gradient(90deg,#a020f0,#ff00ff);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  }
  .modal-box label { display:block; margin:12px 0 5px; font-size:13px; color:#bbb; }
  .modal-box input, .modal-box textarea {
    width:100%; padding:10px; border-radius:6px;
    border:1px solid #444; background:#0d0d0d; color:#fff;
    font-size:14px; outline:none;
  }
  .modal-box input:focus, .modal-box textarea:focus { border-color:#ff00ff; }

  .btn-row { display:flex; gap:10px; margin-top:18px; }
  .btn {
    flex:1; padding:11px; border:none; border-radius:6px;
    font-weight:bold; cursor:pointer; font-size:14px; transition:.2s;
  }
  .btn-primary { background:linear-gradient(90deg,#a020f0,#ff00ff); color:#fff; }
  .btn-primary:hover { box-shadow:0 0 15px #ff00ff; }
  .btn-secondary { background:#333; color:#fff; }
  .btn-danger { background:linear-gradient(90deg,#c62828,#f44336); color:#fff; }
  .btn-danger:hover { box-shadow:0 0 15px #f44336; }

  .detail-thumb {
    width:100%; height:180px; border-radius:8px; margin-bottom:15px;
    background:linear-gradient(135deg,#2a004d,#0d0d0d);
    display:flex; align-items:center; justify-content:center;
    font-size:50px; font-weight:bold; color:#a020f0; overflow:hidden;
  }
  .detail-thumb img { width:100%; height:100%; object-fit:cover; }

  #fab {
    display:none; position:fixed; bottom:25px; right:25px;
    width:60px; height:60px; border-radius:50%;
    background:linear-gradient(135deg,#a020f0,#ff00ff);
    color:#fff; font-size:32px; border:none; cursor:pointer;
    box-shadow:0 0 25px rgba(255,0,255,.7); z-index:150;
    transition:.2s;
  }
  #fab:hover { transform:scale(1.1) rotate(90deg); }

  .empty { text-align:center; color:#666; padding:60px 20px; grid-column:1/-1; }
  .empty-icon { font-size:60px; margin-bottom:15px; opacity:.5; }
  .empty-text { font-size:16px; margin-bottom:5px; }
  .empty-sub { font-size:13px; color:#444; }

  .toast {
    position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
    background:#a020f0; color:#fff; padding:12px 24px; border-radius:8px;
    font-weight:bold; z-index:300; opacity:0; transition:.3s; pointer-events:none;
    max-width:90%; text-align:center;
  }
  .toast.show { opacity:1; }
</style>
</head>
<body>

<header>
  <div class="logo">XENO <span>BUGS</span> INFORMATION</div>
  <div class="header-right">
    <button id="loginBtn">🔐 Login</button>
    <button id="logoutBtn" style="display:none;">Logout</button>
  </div>
</header>

<div class="search-wrap">
  <input type="text" id="searchInput" placeholder="🔍 Cari versi APK... contoh: XENO X VOIDS">
</div>

<div class="grid" id="grid"></div>

<button id="fab" title="Upload APK Baru">+</button>

<!-- MODAL LOGIN -->
<div class="modal" id="loginModal">
  <div class="modal-box">
    <h2>🔐 Login Admin</h2>
    <label>Masukkan Key Admin</label>
    <input type="password" id="keyInput" placeholder="Masukkan key...">
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="closeModal('loginModal')">Batal</button>
      <button class="btn btn-primary" onclick="doLogin()">Masuk</button>
    </div>
  </div>
</div>

<!-- MODAL UPLOAD / EDIT -->
<div class="modal" id="uploadModal">
  <div class="modal-box">
    <h2 id="uploadTitle">➕ Upload APK Baru</h2>
    <label>Judul</label>
    <input type="text" id="upTitle" placeholder="Contoh: APK XENO X VOIDS">

    <label>Link Download</label>
    <input type="text" id="upLink" placeholder="https://...">

    <label>Versi (V)</label>
    <input type="text" id="upVersion" placeholder="Contoh: v1.2.3">

    <label>URL Foto/Thumbnail (opsional)</label>
    <input type="text" id="upImage" placeholder="https://gambar.jpg">

    <div class="btn-row">
      <button class="btn btn-secondary" onclick="closeModal('uploadModal')">Batal</button>
      <button class="btn btn-primary" onclick="doUpload()">Simpan</button>
    </div>
  </div>
</div>

<!-- MODAL DETAIL -->
<div class="modal" id="detailModal">
  <div class="modal-box">
    <div class="detail-thumb" id="detailThumb"></div>
    <h2 id="detailTitle"></h2>
    <p style="margin-bottom:15px;">
      Versi: <span class="card-version" id="detailVersion"></span>
    </p>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="downloadItem()">⬇ Download</button>
      <button class="btn btn-primary" onclick="copyLink()">🔗 Salin Link</button>
    </div>
    <div class="btn-row" id="adminActionsRow" style="display:none;">
      <button class="btn btn-danger" onclick="deleteFromDetail()">🗑 Hapus</button>
      <button class="btn" style="background:#2196f3;color:#fff;" onclick="editFromDetail()">✏ Edit</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="closeModal('detailModal')">Tutup</button>
    </div>
  </div>
</div>

<!-- MODAL KONFIRMASI HAPUS -->
<div class="modal" id="confirmModal">
  <div class="modal-box" style="max-width:380px;">
    <h2 style="background:linear-gradient(90deg,#f44336,#ff5722);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">⚠️ Konfirmasi Hapus</h2>
    <p id="confirmText" style="margin:10px 0 5px;color:#ccc;font-size:14px;">Yakin mau hapus APK ini?</p>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="closeModal('confirmModal')">Batal</button>
      <button class="btn btn-danger" onclick="confirmDelete()">Hapus</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ ADMIN KEY ============ */
const ADMIN_KEY = "172726H-KGF";
let isAdmin = false;

/* ============ DATA (KOSONG DARI AWAL) ============ */
let data = JSON.parse(localStorage.getItem('xenoData') || '[]');
// GAK ADA DATA DUMMY — beneran kosong sampai admin upload

let currentItem = null;
let editingId = null;
let pendingDeleteId = null;

/* ============ FUNGSI DATA ============ */
function save() { localStorage.setItem('xenoData', JSON.stringify(data)); }

function render(filter="") {
  const grid = document.getElementById('grid');
  grid.innerHTML = "";
  const f = filter.toLowerCase().trim();
  const filtered = data.filter(item =>
    item.title.toLowerCase().includes(f) || item.version.toLowerCase().includes(f)
  );

  // Kalau data kosong total (belum ada upload sama sekali)
  if (data.length === 0) {
    grid.innerHTML = `
      <div class="empty">
        <div class="empty-icon">📦</div>
        <div class="empty-text">Belum ada APK yang diupload</div>
        <div class="empty-sub">${isAdmin ? 'Klik tombol + di kanan bawah untuk upload' : 'Tunggu admin upload APK terbaru'}</div>
      </div>`;
    return;
  }

  // Kalau ada data tapi hasil search kosong
  if (filtered.length === 0) {
    grid.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🔍</div>
        <div class="empty-text">Tidak ada hasil untuk "${escapeHtml(filter)}"</div>
      </div>`;
    return;
  }

  filtered.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';

    const thumb = item.image
      ? `<img src="${item.image}" onerror="this.style.display='none'">`
      : `X`;

    const actions = isAdmin
      ? `<div class="card-actions show">
           <button class="icon-btn icon-edit" title="Edit" onclick="event.stopPropagation();editItem(${item.id})">✏</button>
           <button class="icon-btn icon-del" title="Hapus" onclick="event.stopPropagation();askDelete(${item.id})">🗑</button>
         </div>`
      : '';

    card.innerHTML = `
      ${actions}
      <div class="card-thumb">${thumb}</div>
      <div class="card-info">
        <div class="card-title">${escapeHtml(item.title)}</div>
        <span class="card-version">${escapeHtml(item.version)}</span>
      </div>
    `;
    card.onclick = () => openDetail(item.id);
    grid.appendChild(card);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ============ SEARCH ============ */
document.getElementById('searchInput').addEventListener('input', e => {
  render(e.target.value);
});

/* ============ MODAL ============ */
function openModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

/* ============ LOGIN ============ */
document.getElementById('loginBtn').onclick = () => openModal('loginModal');

function doLogin() {
  const key = document.getElementById('keyInput').value.trim();
  if (key === ADMIN_KEY) {
    isAdmin = true;
    document.getElementById('loginBtn').style.display = 'none';
    document.getElementById('logoutBtn').style.display = 'block';
    document.getElementById('fab').style.display = 'block';
    closeModal('loginModal');
    document.getElementById('keyInput').value = '';
    render(document.getElementById('searchInput').value);
    toast('✅ Login berhasil!');
  } else {
    toast('❌ Key salah!');
  }
}

document.getElementById('logoutBtn').onclick = () => {
  isAdmin = false;
  document.getElementById('loginBtn').style.display = 'block';
  document.getElementById('logoutBtn').style.display = 'none';
  document.getElementById('fab').style.display = 'none';
  render(document.getElementById('searchInput').value);
  toast('👋 Logout berhasil');
};

/* ============ UPLOAD / EDIT ============ */
document.getElementById('fab').onclick = () => {
  if (!isAdmin) return;
  editingId = null;
  document.getElementById('uploadTitle').textContent = '➕ Upload APK Baru';
  document.getElementById('upTitle').value = '';
  document.getElementById('upLink').value = '';
  document.getElementById('upVersion').value = '';
  document.getElementById('upImage').value = '';
  openModal('uploadModal');
};

function editItem(id) {
  if (!isAdmin) return;
  const item = data.find(i => i.id === id);
  if (!item) return;

  editingId = id;
  document.getElementById('uploadTitle').textContent = '✏ Edit APK';
  document.getElementById('upTitle').value = item.title;
  document.getElementById('upLink').value = item.link;
  document.getElementById('upVersion').value = item.version;
  document.getElementById('upImage').value = item.image || '';
  openModal('uploadModal');
}

function doUpload() {
  const title = document.getElementById('upTitle').value.trim();
  const link = document.getElementById('upLink').value.trim();
  const version = document.getElementById('upVersion').value.trim();
  const image = document.getElementById('upImage').value.trim();

  if (!title || !link || !version) {
    toast('⚠️ Judul, Link, dan Versi wajib diisi!');
    return;
  }

  if (editingId) {
    const item = data.find(i => i.id === editingId);
    if (item) {
      item.title = title;
      item.link = link;
      item.version = version;
      item.image = image;
    }
    save();
    render(document.getElementById('searchInput').value);
    closeModal('uploadModal');
    toast('✅ APK berhasil diupdate!');
    editingId = null;
  } else {
    const newItem = { id: Date.now(), title, link, version, image };
    data.unshift(newItem);
    save();
    render(document.getElementById('searchInput').value);
    closeModal('uploadModal');
    toast('✅ APK berhasil diupload!');
  }

  document.getElementById('upTitle').value = '';
  document.getElementById('upLink').value = '';
  document.getElementById('upVersion').value = '';
  document.getElementById('upImage').value = '';
}

/* ============ DETAIL ============ */
function openDetail(id) {
  currentItem = data.find(i => i.id === id);
  if (!currentItem) return;

  const thumb = document.getElementById('detailThumb');
  if (currentItem.image) {
    thumb.innerHTML = `<img src="${currentItem.image}" onerror="this.parentNode.innerHTML='X'">`;
  } else {
    thumb.innerHTML = 'X';
  }
  document.getElementById('detailTitle').textContent = currentItem.title;
  document.getElementById('detailVersion').textContent = currentItem.version;
  document.getElementById('adminActionsRow').style.display = isAdmin ? 'flex' : 'none';
  openModal('detailModal');
}

function downloadItem() {
  if (!currentItem) return;
  window.open(currentItem.link, '_blank');
  toast('⬇ Membuka link download...');
}

function copyLink() {
  if (!currentItem) return;
  const link = currentItem.link;
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(link).then(() => toast('🔗 Link berhasil disalin!'))
      .catch(() => fallbackCopy(link));
  } else {
    fallbackCopy(link);
  }
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); toast('🔗 Link berhasil disalin!'); }
  catch(e) { toast('❌ Gagal menyalin link'); }
  ta.remove();
}

/* ============ EDIT / DELETE DARI DETAIL ============ */
function editFromDetail() {
  if (!currentItem) return;
  const id = currentItem.id;
  closeModal('detailModal');
  setTimeout(() => editItem(id), 200);
}

function deleteFromDetail() {
  if (!currentItem) return;
  const id = currentItem.id;
  closeModal('detailModal');
  setTimeout(() => askDelete(id), 200);
}

/* ============ HAPUS ============ */
function askDelete(id) {
  if (!isAdmin) return;
  const item = data.find(i => i.id === id);
  if (!item) return;
  pendingDeleteId = id;
  document.getElementById('confirmText').innerHTML =
    `Yakin mau hapus <b style="color:#ff00ff;">${escapeHtml(item.title)}</b> (${escapeHtml(item.version)})?`;
  openModal('confirmModal');
}

function confirmDelete() {
  if (pendingDeleteId === null) return;
  data = data.filter(i => i.id !== pendingDeleteId);
  save();
  pendingDeleteId = null;
  closeModal('confirmModal');
  render(document.getElementById('searchInput').value);
  toast('🗑 APK berhasil dihapus!');
}

/* ============ TOAST ============ */
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

/* ============ CLOSE MODAL KLIK LUAR ============ */
document.querySelectorAll('.modal').forEach(m => {
  m.addEventListener('click', e => {
    if (e.target === m) m.classList.remove('active');
  });
});

/* ============ INIT ============ */
render();
</script>
</body>
</html>
